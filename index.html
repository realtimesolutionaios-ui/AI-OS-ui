<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI-OS</title>
  <style>
    body {
      font-family: system-ui, -apple-system;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
    }
    input, button, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      cursor: pointer;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
    }
    .muted {
      color: #666;
      font-size: 13px;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .row button {
      width: auto;
      min-width: 120px;
    }
    pre {
      white-space: pre-wrap;
      background: #0b1020;
      color: #d7e1ff;
      padding: 12px;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <h1>AI-OS</h1>

  <!-- 🔐 ログイン -->
  <div id="auth" class="box">
    <h2>ログイン（Email）</h2>
    <p class="muted">
      メールに届くリンク（OTP）でログインします。
    </p>
    <input id="email" type="email" placeholder="you@example.com" />
    <div class="row">
      <button id="sendLink">ログインリンク送信</button>
      <button id="logout" style="background:#111827">ログアウト</button>
    </div>
    <p id="authMsg" class="muted"></p>
  </div>

  <!-- 💬 チャット -->
  <div id="chat" class="box" style="display:none;">
    <h2>AI-OS チャット</h2>
    <textarea id="msg" rows="3" placeholder="メッセージを入力"></textarea>
    <button id="send" style="margin-top:8px;">送信</button>
    <h3>返答</h3>
    <pre id="out"></pre>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const authBox = document.getElementById("auth");
    const chatBox = document.getElementById("chat");
    const authMsg = document.getElementById("authMsg");

    // ① 設定取得
    const cfg = await fetch("/api/config").then(r => r.json());
    console.log("cfg:", cfg);

    // ② Supabase 初期化
    const supabase = createClient(
      cfg.supabaseUrl,
      cfg.supabaseAnonKey
    );

    // 🔁 UI切り替え関数（唯一の真実）
    async function refreshUI() {
      const { data } = await supabase.auth.getSession();
      const session = data.session;

      if (session) {
        authBox.style.display = "none";
        chatBox.style.display = "block";
      } else {
        authBox.style.display = "block";
        chatBox.style.display = "none";
        authMsg.textContent = "未ログイン";
      }
    }

    // 初期表示
    await refreshUI();

    // 🔄 認証状態変化時
    supabase.auth.onAuthStateChange(async () => {
      await refreshUI();
    });

    // ✉️ Magic Link 送信
    document.getElementById("sendLink").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) {
        alert("Emailを入力してください");
        return;
      }

      authMsg.textContent = "送信中…";

      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: window.location.origin
        }
      });

      authMsg.textContent = error
        ? `エラー: ${error.message}`
        : "ログインリンクを送信しました。メールを確認してください。";
    };

    // 🚪 ログアウト
    document.getElementById("logout").onclick = async () => {
      await supabase.auth.signOut();
      await refreshUI();
    };
  </script>
</body>
</html>
