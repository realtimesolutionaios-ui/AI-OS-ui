<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI-OS</title>

  <style>
    body {
      font-family: system-ui, -apple-system;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #111827;
    }
    .muted {
      color: #666;
      font-size: 13px;
    }
    pre {
      background: #0b1020;
      color: #d7e1ff;
      padding: 12px;
      border-radius: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>AI-OS</h1>

  <!-- 🔐 Login -->
  <div id="auth" class="box">
    <h2>ログイン（Email）</h2>
    <input id="email" type="email" placeholder="you@example.com" />
    <button id="sendLink">ログインリンク送信</button>
    <p id="authMsg" class="muted"></p>
  </div>

  <!-- 💬 Chat -->
  <div id="chat" class="box" style="display:none">
    <h2>AI-OS チャット</h2>
    <textarea id="msg" rows="3"></textarea>
    <button id="send">送信</button>
    <h3>返答</h3>
    <pre id="out"></pre>
    <button id="logout" class="secondary">ログアウト</button>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    console.log("AI-OS script boot");

    // 🛡 cfg 二重宣言防止
    if (!window.__AUP_CFG__) {
      window.__AUP_CFG__ = await fetch("/api/config").then(r => r.json());
      console.log("cfg loaded", window.__AUP_CFG__);
    }

    const cfg = window.__AUP_CFG__;

    const supabase = createClient(
      cfg.supabaseUrl,
      cfg.supabaseAnonKey
    );

    const authBox = document.getElementById("auth");
    const chatBox = document.getElementById("chat");
    const authMsg = document.getElementById("authMsg");
    const out = document.getElementById("out");

    async function refreshUI() {
      const { data } = await supabase.auth.getSession();
      if (data.session) {
        authBox.style.display = "none";
        chatBox.style.display = "block";
      } else {
        authBox.style.display = "block";
        chatBox.style.display = "none";
      }
    }

    await refreshUI();

    supabase.auth.onAuthStateChange(refreshUI);

    document.getElementById("sendLink").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) return alert("Emailを入力してください");

      authMsg.textContent = "送信中…";

      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: location.origin }
      });

      authMsg.textContent = error
        ? error.message
        : "メールを確認してください";
    };

    document.getElementById("logout").onclick = async () => {
      await supabase.auth.signOut();
      await refreshUI();
    };

    document.getElementById("send").onclick = async () => {
      const { data } = await supabase.auth.getSession();
      if (!data.session) return alert("未ログイン");

      const message = document.getElementById("msg").value.trim();
      if (!message) return;

      out.textContent = "送信中…";

      const res = await fetch(cfg.gatewayUrl + "/api/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + data.session.access_token
        },
        body: JSON.stringify({ message })
      });

      const json = await res.json();
      out.textContent = json.answer || JSON.stringify(json, null, 2);
    };
  </script>
</body>
</html>
