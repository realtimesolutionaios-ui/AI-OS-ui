<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>AI-OS 認証ゲート</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: #0b0f1a;
      color: #ffffff;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #000;
      color: #fff;
      margin-top: 10px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }

    button:hover {
      background: #1d4ed8;
    }

    #successMessage {
      display: none;
      margin-top: 24px;
      color: #4ade80;
      font-size: 16px;
    }

    #errorMessage {
      display: none;
      margin-top: 24px;
      color: #f87171;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>AI-OS 利用認証</h1>

    <p>認証キーを入力してください</p>

    <input
      id="licenseKey"
      type="text"
      placeholder="認証キー"
    />

    <button onclick="checkLicense()">認証する</button>

    <div id="successMessage">
      ✅ 認証が完了しました。AI-OSを起動します…
    </div>

    <div id="errorMessage">
      ❌ 認証に失敗しました。キーを確認してください。
    </div>
  </div>

<script>
window.addEventListener("DOMContentLoaded", () => {

  const input = document.getElementById("licenseKey");
  const success = document.getElementById("successMessage");
  const error = document.getElementById("errorMessage");

  async function checkLicense() {
    const licenseKey = input.value.trim();

    success.style.display = "none";
    error.style.display = "none";

    if (!licenseKey) {
      error.textContent = "❌ 認証キーを入力してください";
      error.style.display = "block";
      return;
    }

    try {
      const res = await fetch("/api/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ licenseKey })
      });

      const data = await res.json();

      if (data.valid) {
        success.style.display = "block";

        // 🔽 認証成功後に Dify へ遷移
        setTimeout(() => {
          window.location.href = "https://udify.app/chat/PysaqG3VIgbnO9vO";
        }, 1200);

      } else {
        error.textContent = "❌ 認証に失敗しました。キーを確認してください。";
        error.style.display = "block";
      }

    } catch (e) {
      console.error(e);
      error.textContent = "❌ 認証サーバーに接続できません";
      error.style.display = "block";
    }
  }

  // グローバルに公開（onclick 用）
  window.checkLicense = checkLicense;

});
</script>


</body>
</html>
