<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI-OS</title>

  <style>
    body {
      font-family: system-ui, -apple-system;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      cursor: pointer;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      margin-top: 8px;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row button {
      width: auto;
      min-width: 120px;
    }
    .muted {
      color: #666;
      font-size: 13px;
    }
    pre {
      white-space: pre-wrap;
      background: #0b1020;
      color: #d7e1ff;
      padding: 12px;
      border-radius: 12px;
      min-height: 60px;
    }
  </style>
</head>

<body>
  <h1>AI-OS</h1>

  <!-- 🔐 ログイン -->
  <div id="auth" class="box">
    <h2>ログイン（Email）</h2>
    <p class="muted">メールに届くリンク（OTP）でログインします。</p>

    <input id="email" type="email" placeholder="you@example.com" />

    <div class="row">
      <button id="sendLink">ログインリンク送信</button>
      <button id="logout" style="background:#111827">ログアウト</button>
    </div>

    <p id="authMsg" class="muted"></p>
  </div>

  <!-- 💬 チャット -->
  <div id="chat" class="box" style="display:none;">
    <h2>AI-OS チャット</h2>
    <textarea id="msg" rows="3" placeholder="メッセージを入力"></textarea>
    <button id="send">送信</button>

    <h3>返答</h3>
    <pre id="out"></pre>
  </div>

  <!-- ✅ JS（ここが重要） -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const authBox = document.getElementById("auth");
    const chatBox = document.getElementById("chat");
    const authMsg = document.getElementById("authMsg");
    const out = document.getElementById("out");

    // 🔒 cfg を「宣言しない」安全構造
    async function getCfg() {
      if (!window.__AUP_CFG__) {
        window.__AUP_CFG__ = await fetch("/api/config").then(r => r.json());
        console.log("cfg loaded:", window.__AUP_CFG__);
      }
      return window.__AUP_CFG__;
    }

    async function boot() {
      const cfg = await getCfg();

      const supabase = createClient(
        cfg.supabaseUrl,
        cfg.supabaseAnonKey
      );

      async function refreshUI() {
        const { data } = await supabase.auth.getSession();
        const session = data.session;

        if (session) {
          authBox.style.display = "none";
          chatBox.style.display = "block";
        } else {
          authBox.style.display = "block";
          chatBox.style.display = "none";
          authMsg.textContent = "未ログイン";
        }
      }

      await refreshUI();

      supabase.auth.onAuthStateChange(refreshUI);

      // ✉️ ログインリンク送信
      document.getElementById("sendLink").onclick = async () => {
        const email = document.getElementById("email").value.trim();
        if (!email) {
          alert("Emailを入力してください");
          return;
        }

        authMsg.textContent = "送信中…";

        const { error } = await supabase.auth.signInWithOtp({
          email,
          options: {
            emailRedirectTo: window.location.origin
          }
        });

        authMsg.textContent = error
          ? `エラー: ${error.message}`
          : "ログインリンクを送信しました。メールを確認してください。";
      };

      // 🚪 ログアウト
      document.getElementById("logout").onclick = async () => {
        await supabase.auth.signOut();
        await refreshUI();
      };

      // 💬 チャット送信（仮：無反応防止）
      document.getElementById("send").onclick = async () => {
        const text = document.getElementById("msg").value.trim();
        if (!text) return;

        out.textContent = "送信しました（※API未接続）\n\n" + text;
      };
    }

    // 🔑 起動（何回評価されても安全）
    boot();
  </script>
</body>
</html>送信
