<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>AI-OS 認証ゲート</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: #0b0f1a;
      color: #ffffff;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #000;
      color: #fff;
      margin-top: 10px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }

    button:hover {
      background: #1d4ed8;
    }

    #successMessage {
      display: none;
      margin-top: 24px;
      color: #4ade80;
      font-size: 16px;
    }

    #errorMessage {
      display: none;
      margin-top: 24px;
      color: #f87171;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>AI-OS 利用認証</h1>

    <p>認証キーを入力してください</p>

    <input
      id="licenseKey"
      type="text"
      placeholder="認証キー"
    />

    <button onclick="checkLicense()">認証する</button>

    <div id="successMessage">
      ✅ 認証が完了しました。AI-OSを起動します…
    </div>

    <div id="errorMessage">
      ❌ 認証に失敗しました。キーを確認してください。
    </div>
  </div>

 <script>
window.addEventListener("DOMContentLoaded", () => {

  const btn = document.getElementById("verify-btn");
  const input = document.getElementById("license-input");
  const result = document.getElementById("result");

  if (!btn) {
    alert("verify-btn が見つかりません（HTML構造エラー）");
    return;
  }

  btn.addEventListener("click", async () => {
    const licenseKey = input.value.trim();

    if (!licenseKey) {
      result.textContent = "ライセンスキーを入力してください";
      result.style.color = "orange";
      return;
    }

    result.textContent = "確認中...";
    result.style.color = "white";

    try {
      const res = await fetch("/api/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ licenseKey })
      });

      const data = await res.json();

      if (data.valid) {
        result.textContent = "✅ 認証成功";
        result.style.color = "lightgreen";
        document.getElementById("license-box").style.display = "none";
        document.getElementById("app").style.display = "block";
      } else {
        result.textContent = "❌ 無効なライセンスです";
        result.style.color = "red";
      }

    } catch (e) {
      console.error(e);
      result.textContent = "❌ 認証APIエラー";
      result.style.color = "red";
    }
  });

});
</script>

</body>
</html>
