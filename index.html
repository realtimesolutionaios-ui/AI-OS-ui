<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>AI-OS UI（Basic版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: #0b0f1a;
      color: #ffffff;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 20px;
      margin-top: 40px;
    }

    .card {
      background: #11162a;
      border: 1px solid #2a2f4a;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    /* ===== ライセンス認証 ===== */
    #license-box {
      max-width: 420px;
      margin: 60px auto;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #2a2f4a;
      background: #0f1430;
    }

    #license-box input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #000;
      color: #fff;
      margin-top: 10px;
    }

    #license-box button {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #4c6fff;
      color: #fff;
    }

    #licenseStatus {
      margin-top: 12px;
      font-size: 14px;
    }

    /* ===== 認証後に表示 ===== */
    .licensed-only {
      display: none;
    }

    body.licensed .licensed-only {
      display: block;
    }
  </style>
</head>

<body>

  <!-- ライセンス認証 -->
  <div id="license-box">
    <h3>ライセンス認証</h3>
    <input id="licenseKey" placeholder="License Key を入力" />
    <button onclick="verifyLicense()">認証</button>
    <p id="licenseStatus"></p>
  </div>

  <!-- 認証後UI -->
  <div class="container licensed-only">
    <h1>AI-OS UI（正式版）</h1>

    <div class="card">
      <h2>プロダクト概要</h2>
      <p>
        AI-OS UIは、診断 → 判断 → 行動を一気通貫で支援する
        オペレーティング・インターフェースです。
      </p>
    </div>

    <div class="card">
      <h2>現在の提供状況</h2>
      <ul>
        <li>状態診断（Diagnosis）</li>
        <li>意思決定補助（Decision）</li>
        <li>行動設計（Action）</li>
      </ul>
    </div>
  </div>

  <!-- ===== License Verify Script ===== -->
  <script>
    async function verifyLicense() {
      const key = document.getElementById("licenseKey").value;
      const status = document.getElementById("licenseStatus");

      status.innerText = "確認中...";

      try {
        const res = await fetch("https://ai-os-gateway.vercel.app/api/verify", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            license_key: key
          })
        });

        const data = await res.json();

        if (data.valid) {
          status.innerText = "✅ 認証成功";
          document.body.classList.add("licensed");
        } else {
          status.innerText = "❌ 無効なライセンスです";
        }
      } catch (e) {
        status.innerText = "⚠️ 通信エラー";
      }
    }
  </script>

</body>
</html>
