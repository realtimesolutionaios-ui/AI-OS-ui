<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>AI-OS 認証ゲート</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: #0b0f1a;
      color: #ffffff;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #000;
      color: #fff;
      margin-top: 10px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }

    button:hover {
      background: #1d4ed8;
    }

    #successMessage {
      display: none;
      margin-top: 24px;
      color: #4ade80;
      font-size: 16px;
    }

    #errorMessage {
      display: none;
      margin-top: 24px;
      color: #f87171;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>AI-OS 利用認証</h1>

    <p>認証キーを入力してください</p>

    <input
      id="licenseKey"
      type="text"
      placeholder="認証キー"
    />

    <button onclick="checkLicense()">認証する</button>

    <div id="successMessage">
      ✅ 認証が完了しました。AI-OSを起動します…
    </div>

    <div id="errorMessage">
      ❌ 認証に失敗しました。キーを確認してください。
    </div>
  </div>

  <script>
    // ===== Supabase 初期化 =====
    const SUPABASE_URL = "【ここにSupabase URL】";
    const SUPABASE_ANON_KEY = "【ここにSupabase anon key】";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    // ===== 認証処理 =====
    async function checkLicense() {
      const key = document.getElementById("licenseKey").value.trim();
      const successMsg = document.getElementById("successMessage");
      const errorMsg = document.getElementById("errorMessage");

      successMsg.style.display = "none";
      errorMsg.style.display = "none";

      if (!key) {
        errorMsg.textContent = "❌ 認証キーを入力してください。";
        errorMsg.style.display = "block";
        return;
      }

      const { data, error } = await supabase
        .from("licenses")
        .select("id")
        .eq("license_key", key)
        .single();

      if (error || !data) {
        errorMsg.style.display = "block";
      } else {
        // 成功表示
        successMsg.style.display = "block";

        // 1秒後に Dify へ遷移
        setTimeout(() => {
          window.location.href =
            "https://udify.app/chat/PysaqG3VIgbnO9vO";
        }, 1000);
      }
    }
  </script>
</body>
</html>
