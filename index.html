<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI-OS</title>

  <style>
    body {
      font-family: system-ui, -apple-system;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      border: none;
      margin-top: 8px;
      cursor: pointer;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row button {
      width: auto;
      min-width: 120px;
    }
    .muted {
      color: #666;
      font-size: 13px;
    }
    pre {
      background: #0b1020;
      color: #d7e1ff;
      padding: 12px;
      border-radius: 12px;
      min-height: 60px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>AI-OS</h1>

  <!-- 🔐 LOGIN -->
  <div id="auth" class="box">
    <h2>ログイン（Email）</h2>
    <input id="email" type="email" placeholder="you@example.com" />
    <div class="row">
      <button id="sendLink">ログインリンク送信</button>
      <button id="logout" style="background:#111827">ログアウト</button>
    </div>
    <p id="authMsg" class="muted"></p>
  </div>

  <!-- 💬 CHAT -->
  <div id="chat" class="box" style="display:none;">
    <h2>AI-OS チャット</h2>
    <textarea id="msg" rows="3"></textarea>
    <button id="send">送信</button>
    <h3>返答</h3>
    <pre id="out"></pre>
  </div>

  <!-- ✅ SINGLE SOURCE OF TRUTH -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const authBox = document.getElementById("auth");
    const chatBox = document.getElementById("chat");
    const authMsg = document.getElementById("authMsg");
    const out = document.getElementById("out");

    // cfg は window に1回だけ
    async function getCfg() {
      if (!window.__CFG__) {
        window.__CFG__ = await fetch("/api/config").then(r => r.json());
        console.log("cfg loaded:", window.__CFG__);
      }
      return window.__CFG__;
    }

    async function main() {
      const cfg = await getCfg();

      const supabase = createClient(
        cfg.supabaseUrl,
        cfg.supabaseAnonKey
      );

      async function refreshUI() {
        const { data } = await supabase.auth.getSession();
        if (data.session) {
          authBox.style.display = "none";
          chatBox.style.display = "block";
        } else {
          authBox.style.display = "block";
          chatBox.style.display = "none";
          authMsg.textContent = "未ログイン";
        }
      }

      await refreshUI();
      supabase.auth.onAuthStateChange(refreshUI);

      document.getElementById("sendLink").onclick = async () => {
        const email = document.getElementById("email").value.trim();
        if (!email) return alert("Emailを入力してください");

        authMsg.textContent = "送信中…";
        const { error } = await supabase.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: location.origin }
        });

        authMsg.textContent = error
          ? error.message
          : "ログインリンクを送信しました";
      };

      document.getElementById("logout").onclick = async () => {
        await supabase.auth.signOut();
        await refreshUI();
      };

      document.getElementById("send").onclick = () => {
        const text = document.getElementById("msg").value.trim();
        if (!text) return;
        out.textContent = "送信成功（仮）\n\n" + text;
      };
    }

    main();
  </script>
</body>
</html>
