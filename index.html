<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI-OS</title>
  <style>
    body {
      font-family: system-ui, -apple-system;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
    }
    input, button, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      cursor: pointer;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
    }
    .muted {
      color: #666;
      font-size: 13px;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .row button {
      width: auto;
      min-width: 120px;
    }
    pre {
      white-space: pre-wrap;
      background: #0b1020;
      color: #d7e1ff;
      padding: 12px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<h1>AI-OS</h1>

<div id="auth" class="box">
  <h2>ログイン（Email）</h2>
  <p class="muted">
    メールに届くリンク（OTP）でログインします。<br>
    端末が変わっても同じEmailで復元できます。
  </p>

  <input id="email" type="email" placeholder="you@example.com" />

  <div class="row">
    <button id="sendLink">ログインリンク送信</button>
    <button id="logout" style="background:#111827">ログアウト</button>
  </div>

  <p id="authMsg" class="muted"></p>
</div>

<div id="chat" class="box" style="display:none;">
  <h2>AI-OS チャット</h2>
  <textarea id="msg" rows="3" placeholder="メッセージを入力"></textarea>
  <button id="send" style="margin-top:8px;">送信</button>
  <h3>返答</h3>
  <pre id="out"></pre>
</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const authMsg = document.getElementById("authMsg");
  const chatBox = document.getElementById("chat");
  const out = document.getElementById("out");

  // ===============================
  // ① 設定取得（Vercel API）
  // ===============================
  const cfg = await fetch("/api/config").then(r => r.json());
  console.log("cfg loaded:", cfg);

  // ===============================
  // ② Supabase 初期化
  // ===============================
  const supabase = createClient(
    cfg.supabaseUrl,
    cfg.supabaseAnonKey
  );
  console.log("supabase client created");

  // ===============================
  // ③ UI更新（唯一の真実）
  // ===============================
  async function refreshUI() {
    const { data, error } = await supabase.auth.getSession();
    console.log("refreshUI session:", data?.session);

    if (data?.session) {
      chatBox.style.display = "block";
      authMsg.textContent = `ログイン中: ${data.session.user.email}`;
    } else {
      chatBox.style.display = "none";
      authMsg.textContent = "未ログイン";
    }
  }

  // 初期描画
  await refreshUI();

  // ===============================
  // ④ 認証状態監視（これだけ）
  // ===============================
  supabase.auth.onAuthStateChange(async (event, session) => {
    console.log("auth state changed:", event, session);
    await refreshUI();
  });

  // ===============================
  // ⑤ ログインリンク送信
  // ===============================
  document.getElementById("sendLink").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) {
      alert("Emailを入力してください");
      return;
    }

    authMsg.textContent = "送信中…";

    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: window.location.origin
      }
    });

    authMsg.textContent = error
      ? `エラー: ${error.message}`
      : "ログインリンクを送信しました。メールを確認してください。";
  };

  // ===============================
  // ⑥ ログアウト
  // ===============================
  document.getElementById("logout").onclick = async () => {
    await supabase.auth.signOut();
    await refreshUI();
  };

  // ===============================
  // ⑦ Gateway送信
  // ===============================
  document.getElementById("send").onclick = async () => {
    const { data } = await supabase.auth.getSession();
    const session = data.session;

    if (!session?.user) {
      alert("先にログインしてください");
      return;
    }

    const message = document.getElementById("msg").value.trim();
    if (!message) return;

    out.textContent = "送信中…";

    const res = await fetch(`${cfg.gatewayUrl}/api/ask`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${session.access_token}`
      },
      body: JSON.stringify({ message })
    });

    const json = await res.json();

    if (!res.ok) {
      out.textContent = `エラー: ${json.error || "unknown error"}`;
      return;
    }

    out.textContent = json.answer;
    document.getElementById("msg").value = "";
  };
</script>

</body>
</html>
