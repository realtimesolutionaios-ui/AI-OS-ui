<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>AI-OS UI（Basic版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: #0b0f1a;
      color: #ffffff;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 20px;
      margin-top: 40px;
    }

    .card {
      background: #11162a;
      border: 1px solid #2a2f4a;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    /* ===== ライセンス認証 ===== */
    #license-box {
      max-width: 420px;
      margin: 80px auto;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #2a2f4a;
      background: #0f1430;
      text-align: center;
    }

    #license-box input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #000;
      color: #fff;
      margin-top: 12px;
    }

    #license-box button {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #4f7cff, #6b9bff);
      color: #fff;
    }

    #result {
      margin-top: 14px;
      font-size: 14px;
      min-height: 1.2em;
    }

    /* ===== 本編UI ===== */
    #app {
      display: none;
    }
  </style>
</head>

<body>

  <!-- ライセンス認証画面 -->
  <div id="license-box">
    <h2>ライセンス認証</h2>

    <input
      id="license-input"
      type="text"
      placeholder="ライセンスキーを入力"
    />

    <button id="verify-btn">確認</button>

    <div id="result"></div>
  </div>

  <!-- 認証後に表示される本編 -->
  <div id="app" class="container">
    <h1>AI-OS ダッシュボード</h1>

    <div class="card">
      <p>
        🎉 ライセンス認証が完了しました。<br />
        ここからAI-OSの本編UIが展開されます。
      </p>
    </div>

    <div class="card">
      <h2>次の実装候補</h2>
      <ul>
        <li>AUP診断UI</li>
        <li>ユーザープロファイル表示</li>
        <li>行動レコメンド</li>
      </ul>
    </div>
  </div>

  <!-- ===== ライセンス検証ロジック ===== -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const button = document.getElementById("verify-btn");
      const input = document.getElementById("license-input");
      const result = document.getElementById("result");
      const app = document.getElementById("app");
      const licenseBox = document.getElementById("license-box");

      button.addEventListener("click", async () => {
        const licenseKey = input.value.trim();

        if (!licenseKey) {
          result.textContent = "ライセンスキーを入力してください";
          result.style.color = "orange";
          return;
        }

        result.textContent = "確認中...";
        result.style.color = "white";

        try {
          const res = await fetch("/api/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ licenseKey })
          });

          const data = await res.json();

          if (data.valid) {
            result.textContent = "✅ 認証成功";
            result.style.color = "lightgreen";

            // UI切り替え
            licenseBox.style.display = "none";
            app.style.display = "block";
          } else {
            result.textContent = "❌ 無効なライセンスです";
            result.style.color = "red";
          }
        } catch (e) {
          result.textContent = "通信エラーが発生しました";
          result.style.color = "red";
        }
      });
    });
  </script>

</body>
</html>
